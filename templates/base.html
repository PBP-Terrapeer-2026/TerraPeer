{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Plan your garden and care for your plants with TerraPeer.{% endblock %}">
    <title>{% block title %}TerraPeer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="{% url 'index' %}" aria-label="TerraPeer home">
                <svg class="brand-icon" viewBox="0 0 38 45" fill="none" aria-hidden="true">
                    <path d="M19 23V11M19 17C10 17 7 11 7 5c8 0 12 4 12 12ZM19 15c0-7 5-11 13-11 0 7-4 11-13 11Z" fill="#267353"/>
                    <path d="M10 25h18l-2 15H12l-2-15Z" fill="#C3654C"/>
                    <path d="M8 25h22M19 28v8" stroke="#C3654C" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span>TerraPeer</span>
            </a>

            <div class="nav-links">
                <a href="#">Login</a>
                <a href="#">Sign Up</a>
                <span class="nav-more" aria-hidden="true">•••</span>
            </div>
        </nav>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div>
                <p class="footer-brand">TerraPeer</p>
                <p class="footer-tagline">Your digital garden peer.</p>
            </div>
            <p class="footer-copyright">&copy; {% now "Y" %} TerraPeer. Grow with confidence.</p>
        </div>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
