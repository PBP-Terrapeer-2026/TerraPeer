
{% extends "base.html" %}

{% block title %}Delete Journal Entry — TerraPeer{% endblock %}

{% block content %}
<section class="journal-delete-page">
    <h1>Delete Journal Entry</h1>

    <p>
        Are you sure you want to delete
        "{{ entry.title }}" for {{ entry.plant_name }}?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete entry</button>
        <a href="{% url 'garden_journal' %}">Cancel</a>
    </form>
</section>
{% endblock %}
