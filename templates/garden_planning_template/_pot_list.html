{% for pot in pots %}
  <li class="d-flex flex-wrap align-items-center justify-content-between gap-3 p-3 rounded-3 border bg-light plan-item" data-id="{{ pot.id }}">
    <div>
      <div class="fw-bold text-success-emphasis plan-item-name">{{ pot.name }}</div>
      <div class="small text-body-secondary mt-1 plan-item-loc">{{ pot.size_cm }} cm · {{ pot.material|default:"material tidak disebutkan" }}</div>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-outline-success btn-sm" type="button" onclick="editPot({{ pot.id }}, this)">Edit</button>
      <button class="btn btn-danger btn-sm" type="button" onclick="deletePot({{ pot.id }}, this)">Hapus</button>
    </div>
  </li>
{% empty %}
  <li class="small text-secondary">Belum ada pot.</li>
{% endfor %}
