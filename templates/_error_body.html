<section class="container py-5 my-lg-4" aria-labelledby="error-title">
    <div class="row justify-content-center">
        <div class="col-12 col-md-9 col-lg-7 text-center">
            <p class="tp-eyebrow mb-2">{{ code }}</p>
            <h1 id="error-title" class="mb-3">{{ heading }}</h1>
            <p class="text-muted mb-4">{{ message }}</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a class="btn btn-primary" href="{% url 'show_main' %}">Back to home</a>
                {% if user.is_authenticated %}<a class="btn btn-outline-primary" href="{% url 'my_plants:list' %}">Go to My Plants</a>
                {% else %}<a class="btn btn-outline-primary" href="{% url 'login' %}">Log in</a>{% endif %}
            </div>
        </div>
    </div>
</section>
