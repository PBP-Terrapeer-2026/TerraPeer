{% extends "base.html" %}
{% load static %}

{% block body_class %}gs-layout{% endblock %}

{% block extra_head %}
{{ block.super }}
<link
    rel="stylesheet"
    href="{% static 'garden_setup/css/garden_setup.css' %}"
>
{% endblock %}

{% block content %}
<div class="gs-page">
    <div class="container gs-container">
        {% block gs_content %}{% endblock %}
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
{{ block.super }}
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
></script>
{% endblock %}
