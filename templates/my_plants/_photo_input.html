<div class="mp-photo-picker" data-photo-picker>
    <div class="mp-photo-preview is-empty" data-photo-preview aria-hidden="true">
        <svg class="mp-icon"><use href="#i-camera"/></svg>
    </div>
    <div class="flex-grow-1 min-w-0">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required or required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
        {{ field }}
        <div class="invalid-feedback d-block" data-field-error="{{ field.name }}" id="{{ field.id_for_label }}-error">{% for error in field.errors %}{{ error }} {% endfor %}</div>
        <div class="form-text" data-photo-help>{{ field.help_text }}</div>
    </div>
</div>
