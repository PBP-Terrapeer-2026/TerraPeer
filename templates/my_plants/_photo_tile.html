<li class="mp-tile" data-photo-tile>
    <a class="mp-tile-img" href="{{ photo.get_absolute_url }}" target="_blank" rel="noopener">
        <img src="{{ photo.get_absolute_url }}" alt="{{ plant.name }} at {{ photo.get_stage_display|lower }}, day {{ photo.day_number }}{% if photo.caption %}: {{ photo.caption }}{% endif %}" width="{{ photo.width }}" height="{{ photo.height }}" loading="lazy" decoding="async">
    </a>
    <div class="mp-tile-body">
        <div class="d-flex justify-content-between align-items-center gap-2">
            <span class="badge mp-stage mp-stage-{{ photo.stage }}">{{ photo.get_stage_display }}</span>
            <form method="post" action="{% url 'my_plants:photo_delete' plant.pk photo.pk %}" data-photo-delete>
                {% csrf_token %}
                <button type="submit" class="btn btn-link btn-sm text-muted p-1" aria-label="Delete photo from {{ photo.created_at|date:'j M Y' }}"><svg class="mp-icon mp-icon-sm"><use href="#i-trash"/></svg></button>
            </form>
        </div>
        <p class="mb-0 small fw-semibold">Day {{ photo.day_number }} · <time datetime="{{ photo.created_at|date:'c' }}">{{ photo.created_at|date:"j M Y" }}</time></p>
        {% if photo.caption %}<p class="mb-0 small text-muted">{{ photo.caption }}</p>{% endif %}
    </div>
</li>
