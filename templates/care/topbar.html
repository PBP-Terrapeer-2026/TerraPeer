{% load care_icons %}
<div class="care-topbar shell">
    {% include "terrapeer/nav.html" %}
    <div class="mobile-top">
        <a class="iconbtn" href="{% url 'show_main' %}" aria-label="Back home">←</a>
        <strong>Plant Care</strong>
        {% if plant %}
            <button class="btn"
                    data-open="{% url 'care:add' plant.pk %}"
                    aria-label="New care task"
                    {% if not plant.active %}disabled{% endif %}>{% icon 'plus' %}</button>
        {% endif %}
    </div>
</div>
{% if care_demo %}
    <p class="demo-banner shell">Demo mode · separate sample database · sample weather, not live data</p>{% endif %}
