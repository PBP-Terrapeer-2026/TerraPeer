name: CI

# Runs the whole Django test suite on every pull request and on main,
# against SQLite (local development) and PostgreSQL (the database PWS uses).
# On main, a passing build is deployed to PWS when the PWS secrets are set.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: terrapeer
          POSTGRES_PASSWORD: terrapeer
          POSTGRES_DB: terrapeer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrapeer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Use PostgreSQL production settings
        if: matrix.database == 'postgresql'
        run: |
          {
            echo "PRODUCTION=true"
            echo "DJANGO_SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-$(openssl rand -hex 16)"
            echo "DB_NAME=terrapeer"
            echo "DB_USER=terrapeer"
            echo "DB_PASSWORD=terrapeer"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "SCHEMA=public"
          } >> "$GITHUB_ENV"

      - name: Django system checks
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply cleanly
        run: python manage.py migrate --noinput

      - name: Static files collect
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test --noinput

  deploy:
    name: Deploy to PWS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PWS_REPO: https://pws.cs.ui.ac.id/muhammad.farel52/terrapeer
      PWS_USERNAME: ${{ secrets.PWS_USERNAME }}
      PWS_PASSWORD: ${{ secrets.PWS_PASSWORD }}
    steps:
      - name: Skip when PWS secrets are not configured
        id: secrets
        run: |
          if [ -z "$PWS_USERNAME" ] || [ -z "$PWS_PASSWORD" ]; then
            echo "PWS_USERNAME / PWS_PASSWORD are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Push main to PWS
        if: steps.secrets.outputs.ready == 'true'
        run: |
          auth=$(printf '%s:%s' "$PWS_USERNAME" "$PWS_PASSWORD" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic ${auth}" push "$PWS_REPO" HEAD:refs/heads/master
